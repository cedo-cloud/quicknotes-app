<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Note-Taking App.</p>
    </header>

    <main>
        <section id="add-note-section">
            <h2>Add a note</h2>
            <form id="note-form">
                <label for="note-input">Note:</label>
                <input type="text" id="note-input" placeholder="What's on your mind?" maxlength="200" required>
                
                <label for="note-category" class="sr-only">Category:</label>
                <select id="note-category">
                    <option value="personal">Personal</option>
                    <option value="work">Work</option>
                    <option value="study">Study</option>
                </select>
                
                <button type="submit" id="add-btn">Add Note</button>
                <button type="button" id="clear-all-btn">Clear All</button>
            </form>
            <p id="error-message"></p>
        </section>

        <section id="your-notes-section">
            <h2>Your notes</h2>
            <input type="text" id="search-input" placeholder="Search notes...">
            <p id="note-count"></p>
            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes</p>
    </footer>
</body>
</html>
